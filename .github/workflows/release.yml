# Build Windows + macOS installers on tag push and create a GitHub Release with the assets.
# Push a tag (e.g. v1.0.0) to trigger: git tag v1.0.0 && git push origin v1.0.0
#
# Required repo secrets (Settings → Secrets → Actions):
#   VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_APP_LAUNCH_MODE: live
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri (Windows)
        run: npm run tauri:build:win -- --verbose

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/

  build-macos:
    runs-on: macos-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_APP_LAUNCH_MODE: live
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri (macOS)
        run: npm run tauri:build:mac -- --verbose

      - name: List Tauri target (diagnostic)
        run: |
          echo "=== src-tauri/target structure ==="
          find src-tauri/target -type d -name bundle 2>/dev/null || true
          find src-tauri/target -name "*.dmg" 2>/dev/null || true
          ls -la src-tauri/target/ 2>/dev/null || true
          ls -la src-tauri/target/*/release/ 2>/dev/null || true
          ls -la src-tauri/target/release/ 2>/dev/null || true

      - name: Locate macOS bundle (find .dmg, then its bundle dir)
        id: macos-bundle
        run: |
          set -e
          echo "=== Finding .dmg under src-tauri/target ==="
          DMG=$(find src-tauri/target -name "*.dmg" -print -quit 2>/dev/null || true)
          if [ -z "$DMG" ]; then
            echo "::error::No .dmg found. The Tauri macOS build did not produce a DMG."
            echo "Check the 'Build Tauri (macOS)' step above for compile/DMG errors."
            echo "Common causes: Rust/Node build failure, or DMG script failing in CI (try --bundles dmg)."
            echo "=== Contents of src-tauri/target ==="
            ls -laR src-tauri/target/ 2>/dev/null || true
            exit 1
          fi
          echo "Found .dmg: $DMG"
          # Walk up to the 'bundle' directory so we upload the whole bundle (e.g. bundle/macos/WhoNow.dmg)
          BUNDLE_DIR=$(dirname "$DMG")
          while [ "$BUNDLE_DIR" != "." ] && [ "$BUNDLE_DIR" != "/" ]; do
            if [ "$(basename "$BUNDLE_DIR")" = "bundle" ]; then
              break
            fi
            BUNDLE_DIR=$(dirname "$BUNDLE_DIR")
          done
          if [ "$(basename "$BUNDLE_DIR")" != "bundle" ]; then
            BUNDLE_DIR=$(dirname "$DMG")
          fi
          echo "dir=$BUNDLE_DIR" >> $GITHUB_OUTPUT
          echo "Uploading bundle dir: $BUNDLE_DIR"
          ls -la "$BUNDLE_DIR"
          find "$BUNDLE_DIR" -name "*.dmg" || true

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: ${{ steps.macos-bundle.outputs.dir }}

  release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer

      - name: Download macOS installer
        uses: actions/download-artifact@v4
        with:
          name: macos-installer

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: WhoNow ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            windows-installer/*.msi
            windows-installer/*.exe
            macos-installer/**/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
