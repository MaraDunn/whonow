# Build Windows + macOS installers on tag push and create a GitHub Release with the assets.
# Push a tag (e.g. v1.0.0) to trigger: git tag v1.0.0 && git push origin v1.0.0
#
# Version is set automatically from the tag (e.g. v1.0.0 → 1.0.0) - no manual bump needed.
#
# Required repo secrets (Settings → Secrets → Actions):
#   VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY
#   TAURI_SIGNING_PRIVATE_KEY (either raw key file contents OR base64 of the key file)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD (optional - only if you set a password)
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_APP_LAUNCH_MODE: live
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set version from tag
        run: node scripts/set-version-from-tag.js

      - name: Prepare updater signing key (file path)
        shell: pwsh
        env:
          KEY_SECRET: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $keySecret = $env:KEY_SECRET
          if (-not $keySecret.Trim()) { throw "TAURI_SIGNING_PRIVATE_KEY secret is missing/empty." }

          $keyPath = Join-Path $env:USERPROFILE ".tauri\whonow.key"
          New-Item -ItemType Directory -Force -Path (Split-Path $keyPath) | Out-Null

          $trim = $keySecret.Trim()
          try {
            $bytes = [System.Convert]::FromBase64String($trim)
            [System.IO.File]::WriteAllBytes($keyPath, $bytes)
          } catch {
            # Fall back to writing raw (minisign) key content
            Set-Content -Path $keyPath -Value $keySecret -NoNewline -Encoding utf8
          }

          "TAURI_SIGNING_PRIVATE_KEY=$keyPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $pw = $env:KEY_PASSWORD
          if ($pw -ne $null -and $pw -ne "") {
            "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$pw" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri (Windows)
        run: npm run tauri:build:win -- --verbose

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/

  build-macos:
    runs-on: macos-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_APP_LAUNCH_MODE: live
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set version from tag
        run: node scripts/set-version-from-tag.js

      - name: Prepare updater signing key (file path)
        env:
          KEY_SECRET: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEY_SECRET:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is missing/empty."
            exit 1
          fi
          mkdir -p "$HOME/.tauri"
          key_path="$HOME/.tauri/whonow.key"
          if printf "%s" "$KEY_SECRET" | base64 --decode > "$key_path" 2>/dev/null; then
            echo "Decoded base64 key into $key_path"
          else
            printf "%s" "$KEY_SECRET" > "$key_path"
            echo "Wrote raw key into $key_path"
          fi
          echo "TAURI_SIGNING_PRIVATE_KEY=$key_path" >> "$GITHUB_ENV"
          if [ -n "${KEY_PASSWORD:-}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri (macOS)
        run: npm run tauri:build:mac -- --verbose

      - name: Locate macOS bundle (find .dmg, then its bundle dir)
        id: macos-bundle
        run: |
          set -e
          echo "=== Finding .dmg under src-tauri/target ==="
          DMG=$(find src-tauri/target -name "*.dmg" -print -quit 2>/dev/null || true)
          if [ -z "$DMG" ]; then
            echo "::error::No .dmg found. The Tauri macOS build did not produce a DMG."
            echo "Check the 'Build Tauri (macOS)' step above for compile/DMG errors."
            echo "=== Contents of src-tauri/target ==="
            ls -laR src-tauri/target/ 2>/dev/null || true
            exit 1
          fi
          echo "Found .dmg: $DMG"
          BUNDLE_DIR=$(dirname "$DMG")
          while [ "$BUNDLE_DIR" != "." ] && [ "$BUNDLE_DIR" != "/" ]; do
            if [ "$(basename "$BUNDLE_DIR")" = "bundle" ]; then
              break
            fi
            BUNDLE_DIR=$(dirname "$BUNDLE_DIR")
          done
          if [ "$(basename "$BUNDLE_DIR")" != "bundle" ]; then
            BUNDLE_DIR=$(dirname "$DMG")
          fi
          echo "dir=$BUNDLE_DIR" >> $GITHUB_OUTPUT
          echo "Uploading bundle dir: $BUNDLE_DIR"
          ls -la "$BUNDLE_DIR"
          find "$BUNDLE_DIR" -name "*.dmg" || true

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: ${{ steps.macos-bundle.outputs.dir }}

  release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer

      - name: Download macOS installer
        uses: actions/download-artifact@v4
        with:
          name: macos-installer

      - name: Generate latest.json for Tauri updater
        run: node scripts/generate-latest-json.js

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: WhoNow ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            windows-installer/**/*
            macos-installer/**/*
            latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
