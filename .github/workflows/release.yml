# Build Windows + macOS installers on tag push using official tauri-action.
# Push a tag (e.g. v1.0.0) to trigger: git tag v1.0.0 && git push origin v1.0.0
#
# Version is set automatically from the tag (e.g. v1.0.0 → 1.0.0).
#
# Required repo secrets (Settings → Secrets → Actions):
#   VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY
#   TAURI_SIGNING_PRIVATE_KEY (contents of ~/.tauri/whonow.key - copy with pbcopy)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD (password you set - or omit if no password)
#   macOS: APPLE_CERTIFICATE (base64 of .p12), APPLE_CERTIFICATE_PASSWORD, KEYCHAIN_PASSWORD
#   macOS notarization: APPLE_ID, APPLE_PASSWORD (app-specific), APPLE_TEAM_ID
# Optional: VITE_APP_URL as repo Variable or Secret (e.g. https://app.whonow.co)
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'windows-latest'
            args: '--bundles msi'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set version from tag
        run: node scripts/set-version-from-tag.js

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies
        run: npm ci

      - name: Import Apple Developer Certificate
        id: apple-cert
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          CERT_LINE=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1)
          IDENTITY=$(echo "$CERT_LINE" | sed -n 's/.*"\(.*\)".*/\1/p')
          echo "signing_identity=$IDENTITY" >> $GITHUB_OUTPUT

      - name: Increase notary upload timeout
        if: matrix.platform == 'macos-latest'
        run: |
          defaults write com.apple.gke.notary.tool nt-upload-connection-timeout 600

      - name: Build and release with tauri-action
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_APP_LAUNCH_MODE: live
          VITE_APP_URL: ${{ vars.VITE_APP_URL || secrets.VITE_APP_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CI: ${{ matrix.platform == 'macos-latest' && 'true' || 'false' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ steps.apple-cert.outputs.signing_identity }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'WhoNow ${{ github.ref_name }}'
          releaseBody: 'See the assets to download and install.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          includeUpdaterJson: true
          tauriScript: npm run tauri

      # Re-package DMG from the stapled app: proper layout (app + Applications symlink) and re-upload
      - name: Rebuild DMG from stapled app and re-upload
        if: matrix.platform == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if [[ "${{ matrix.args }}" == *"aarch64"* ]]; then
            TARGET="aarch64-apple-darwin"
            ARCH="aarch64"
          else
            TARGET="x86_64-apple-darwin"
            ARCH="x64"
          fi
          APP="src-tauri/target/${TARGET}/release/bundle/macos/WhoNow.app"
          DMG_NAME="WhoNow_${VER}_${ARCH}.dmg"
          IDENTITY="${{ steps.apple-cert.outputs.signing_identity }}"
          CODE_RESOURCES="$APP/Contents/CodeResources"
          if [[ -L "$CODE_RESOURCES" ]]; then
            echo "CodeResources is a symlink; removing and re-signing so stapling can work..."
            rm "$CODE_RESOURCES"
            codesign --force --deep --sign "$IDENTITY" "$APP"
            echo "Re-notarizing and re-stapling app after re-sign..."
            ditto -c -k --keepParent "$APP" WhoNow.zip
            xcrun notarytool submit WhoNow.zip --apple-id "${{ secrets.APPLE_ID }}" --password "${{ secrets.APPLE_PASSWORD }}" --team-id "${{ secrets.APPLE_TEAM_ID }}" --wait
            xcrun stapler staple "$APP"
            rm -f WhoNow.zip
          fi
          echo "Checking for entitlements that can cause Gatekeeper to reject..."
          if codesign -d --entitlements - --xml -- "$APP" 2>/dev/null | grep -qE 'allow-jit|allow-unsigned-executable-memory'; then
            echo "::error::App or a nested binary has allow-jit or allow-unsigned-executable-memory; Gatekeeper may reject. Adjust Tauri entitlements."
            exit 1
          fi
          echo "Verifying app is notarized/stapled..."
          xcrun stapler validate "$APP" || { echo "::error::App is not stapled; release DMG would be unnotarized."; exit 1; }
          echo "Verifying app would be accepted by Gatekeeper (spctl)..."
          spctl -a -t execute -v -- "$APP" || { echo "::error::App would be rejected by Gatekeeper (spctl). Check entitlements and bundle."; exit 1; }
          STAGE="dmg-stage"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          ditto "$APP" "$STAGE/WhoNow.app"
          echo "Verifying stapled ticket survived ditto copy..."
          xcrun stapler validate "$STAGE/WhoNow.app" || { echo "::error::Stapled ticket lost during ditto copy."; exit 1; }
          spctl -a -t execute -v -- "$STAGE/WhoNow.app" || { echo "::error::Gatekeeper would reject staged app (entitlements/bundle?)."; exit 1; }
          ln -s /Applications "$STAGE/Applications"
          echo "Creating DMG with app + Applications folder..."
          rm -f "$DMG_NAME"
          hdiutil create -volname "WhoNow" -srcfolder "$STAGE" -ov -format UDZO "$DMG_NAME"
          rm -rf "$STAGE"
          echo "Verifying app inside DMG still has stapled ticket and passes Gatekeeper..."
          hdiutil attach "$DMG_NAME" -readonly -nobrowse
          APP_IN_DMG="/Volumes/WhoNow/WhoNow.app"
          xcrun stapler validate "$APP_IN_DMG" || { hdiutil detach /Volumes/WhoNow; echo "::error::Stapled ticket lost inside DMG (xattrs not preserved by hdiutil)."; exit 1; }
          spctl -a -t execute -v -- "$APP_IN_DMG" || { hdiutil detach /Volumes/WhoNow; echo "::error::Gatekeeper would reject app inside DMG."; exit 1; }
          hdiutil detach /Volumes/WhoNow
          codesign --force --sign "${{ steps.apple-cert.outputs.signing_identity }}" "$DMG_NAME"
          echo "Notarizing DMG so opening the disk image is trusted..."
          xcrun notarytool submit "$DMG_NAME" --apple-id "${{ secrets.APPLE_ID }}" --password "${{ secrets.APPLE_PASSWORD }}" --team-id "${{ secrets.APPLE_TEAM_ID }}" --wait
          xcrun stapler staple "$DMG_NAME"
          gh release upload "$GITHUB_REF_NAME" "$DMG_NAME" --clobber
