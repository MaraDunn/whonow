# Build Windows + macOS installers on tag push using official tauri-action.
# Push a tag (e.g. v1.0.0) to trigger: git tag v1.0.0 && git push origin v1.0.0
#
# Version is set automatically from the tag (e.g. v1.0.0 → 1.0.0).
#
# Required repo secrets (Settings → Secrets → Actions):
#   VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY
#   TAURI_SIGNING_PRIVATE_KEY (contents of ~/.tauri/whonow.key - copy with pbcopy)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD (password you set - or omit if no password)
#   RELEASE_GITHUB_TOKEN - PAT with repo scope (classic) or Contents + Metadata (fine-grained); used to create the release
#   macOS: APPLE_CERTIFICATE (base64 of .p12), APPLE_CERTIFICATE_PASSWORD, KEYCHAIN_PASSWORD
#   macOS notarization: APPLE_ID, APPLE_PASSWORD (app-specific), APPLE_TEAM_ID
# Optional: VITE_APP_URL as repo Variable or Secret (e.g. https://app.whonow.co)
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Create the release first with PAT so tauri-action can upload (avoids "Resource not accessible by integration").
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release for tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: WhoNow ${{ github.ref_name }}
          body: See the assets to download and install.
          draft: false
          token: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}

  release:
    needs: create-release
    permissions:
      contents: write
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-26'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-26'
            args: '--target x86_64-apple-darwin'
          - platform: 'windows-latest'
            args: '--bundles msi'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set version from tag
        run: node scripts/set-version-from-tag.js

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-26' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies
        run: npm ci

      - name: Import Apple Developer Certificate
        id: apple-cert
        if: matrix.platform == 'macos-26'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          CERT_LINE=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1)
          IDENTITY=$(echo "$CERT_LINE" | sed -n 's/.*"\(.*\)".*/\1/p')
          echo "signing_identity=$IDENTITY" >> $GITHUB_OUTPUT

      - name: Increase notary upload timeout
        if: matrix.platform == 'macos-26'
        run: |
          defaults write com.apple.gke.notary.tool nt-upload-connection-timeout 600

      - name: Build and release with tauri-action
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_APP_LAUNCH_MODE: live
          VITE_APP_URL: ${{ vars.VITE_APP_URL || secrets.VITE_APP_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CI: ${{ matrix.platform == 'macos-26' && 'true' || 'false' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ steps.apple-cert.outputs.signing_identity }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'WhoNow ${{ github.ref_name }}'
          releaseBody: 'See the assets to download and install.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          includeUpdaterJson: true
          tauriScript: npm run tauri

      # Rebuild DMG with standalone app notarization and writable HFS+ to preserve staple.
      #
      # Root cause: tauri-action only notarizes its DMG — tickets created from DMG scans
      # may not be retrievable via stapler on end-user machines (stapler staple fails with
      # error 65 even though Apple's notarization log shows the CDHash as Accepted).
      # Additionally, hdiutil create -srcfolder silently drops directory-level xattrs (the
      # staple ticket), so stapler validate exits 0 on CI only via online fallback.
      #
      # Fix:
      # 1. Explicitly notarize a ZIP of the app (standalone, not inside a DMG)
      # 2. Staple the app after standalone notarization
      # 3. Verify the staple xattr is physically present (xattr -p, not stapler validate)
      # 4. Create a writable HFS+ sparse image, ditto the stapled app in, staple AGAIN
      #    inside the mounted volume, detach, convert to UDBZ
      # 5. Verify the staple xattr survives the UDBZ conversion
      # 6. Sign and notarize the DMG, staple the DMG
      - name: Rebuild DMG from notarized app and re-upload
        if: matrix.platform == 'macos-26'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          if [[ "${{ matrix.args }}" == *"aarch64"* ]]; then
            TARGET="aarch64-apple-darwin"
            ARCH="aarch64"
          else
            TARGET="x86_64-apple-darwin"
            ARCH="x64"
          fi
          APP="src-tauri/target/${TARGET}/release/bundle/macos/WhoNow.app"
          DMG_NAME="WhoNow_${VER}_${ARCH}.dmg"
          IDENTITY="${{ steps.apple-cert.outputs.signing_identity }}"

          echo "========== STEP 1: CDHash baseline =========="
          codesign -dvvvv "$APP" 2>&1 | grep -iE "CDHash|Identifier|TeamIdentifier" || true

          # ---- STEP 2: Explicitly notarize a ZIP of the app (standalone) ----
          # tauri-action only notarized its DMG; tickets from DMG scans may not be
          # available via stapler on end-user machines. Submitting a zip creates a
          # first-class ticket directly associated with the app's CDHash.
          echo "========== STEP 2: Standalone app notarization (zip) =========="
          ditto -c -k --keepParent "$APP" WhoNow_app.zip
          SUBMIT_APP_OUT=$(xcrun notarytool submit WhoNow_app.zip \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --password "${{ secrets.APPLE_PASSWORD }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" \
            --wait 2>&1)
          echo "$SUBMIT_APP_OUT"
          APP_SUB_ID=$(echo "$SUBMIT_APP_OUT" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)
          if [[ -n "$APP_SUB_ID" ]]; then
            echo "--- App notarization log ---"
            xcrun notarytool log "$APP_SUB_ID" \
              --apple-id "${{ secrets.APPLE_ID }}" \
              --password "${{ secrets.APPLE_PASSWORD }}" \
              --team-id "${{ secrets.APPLE_TEAM_ID }}" 2>&1 || true
          fi
          rm -f WhoNow_app.zip

          # ---- STEP 3: Staple the app ----
          echo "========== STEP 3: Staple app after standalone notarization =========="
          xcrun stapler staple "$APP" 2>&1
          echo "--- Verify staple xattr is physically present (not relying on online check) ---"
          XATTR_SIZE=$(xattr -p com.apple.security.cms "$APP" 2>/dev/null | wc -c || echo "0")
          echo "com.apple.security.cms xattr size on app directory: $XATTR_SIZE bytes"
          if [[ "$XATTR_SIZE" -lt 10 ]]; then
            echo "::warning::Staple xattr appears missing or tiny on the app directory."
            echo "All xattrs on app:"
            xattr -l "$APP" 2>&1 || true
            echo "Checking if ticket is inside the bundle instead:"
            find "$APP" -name "CodeResources" -o -name "*.ticket" 2>/dev/null || true
          fi
          xcrun stapler validate "$APP" 2>&1; echo "stapler validate exit: $?"

          # ---- STEP 4: Create staging directory ----
          echo "========== STEP 4: Staging =========="
          STAGE="dmg-stage"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          ditto "$APP" "$STAGE/WhoNow.app"
          echo "--- Staple xattr on staged copy ---"
          XATTR_STAGED=$(xattr -p com.apple.security.cms "$STAGE/WhoNow.app" 2>/dev/null | wc -c || echo "0")
          echo "com.apple.security.cms xattr size on staged copy: $XATTR_STAGED bytes"
          ln -s /Applications "$STAGE/Applications"

          INSTALL_SCRIPT="$STAGE/Install WhoNow.command"
          printf '%s\n' \
            '#!/bin/bash' \
            'set -e' \
            'VOL="/Volumes/WhoNow"' \
            'APP="$VOL/WhoNow.app"' \
            'if [[ ! -d "$APP" ]]; then' \
            '  echo "WhoNow.app not found. Make sure the WhoNow disk image is mounted."' \
            '  read -n 1 -p "Press a key to close..."' \
            '  exit 1' \
            'fi' \
            'echo "Installing WhoNow to Applications..."' \
            'ditto "$APP" "/Applications/WhoNow.app"' \
            'xattr -d com.apple.quarantine "/Applications/WhoNow.app" 2>/dev/null || true' \
            'echo "Done. Opening WhoNow."' \
            'open -a WhoNow 2>/dev/null || true' \
            'exit 0' \
            > "$INSTALL_SCRIPT"
          chmod +x "$INSTALL_SCRIPT"
          codesign --force --sign "$IDENTITY" "$INSTALL_SCRIPT"

          # ---- STEP 5: Create DMG via writable HFS+ sparse → convert to UDBZ ----
          # hdiutil create -srcfolder silently drops directory-level xattrs (the staple).
          # Instead: create a writable HFS+ sparse image, ditto the stapled app in,
          # staple AGAIN inside the mounted HFS+ volume (writes to HFS+ attribute B-tree),
          # detach, convert to UDBZ. The HFS+ attribute B-tree survives UDBZ compression.
          echo "========== STEP 5: Create DMG (writable HFS+ → staple inside → UDBZ) =========="
          SPARSE="WhoNow_temp.sparseimage"
          rm -f "$DMG_NAME" "$SPARSE"
          hdiutil create -size 200m -type SPARSE -fs HFS+ -volname "WhoNow" -ov "$SPARSE"
          hdiutil attach "$SPARSE" -nobrowse
          ditto "$STAGE/WhoNow.app" "/Volumes/WhoNow/WhoNow.app"
          cp -p "$STAGE/Install WhoNow.command" "/Volumes/WhoNow/Install WhoNow.command"
          codesign --force --sign "$IDENTITY" "/Volumes/WhoNow/Install WhoNow.command"
          ln -s /Applications "/Volumes/WhoNow/Applications"
          echo "--- Stapling app INSIDE the mounted HFS+ volume ---"
          xcrun stapler staple "/Volumes/WhoNow/WhoNow.app" 2>&1
          echo "--- Verify staple xattr inside mounted HFS+ volume ---"
          XATTR_HFS=$(xattr -p com.apple.security.cms "/Volumes/WhoNow/WhoNow.app" 2>/dev/null | wc -c || echo "0")
          echo "com.apple.security.cms xattr size inside HFS+ volume: $XATTR_HFS bytes"
          xcrun stapler validate "/Volumes/WhoNow/WhoNow.app" 2>&1; echo "stapler validate HFS+ exit: $?"
          hdiutil detach /Volumes/WhoNow
          rm -rf "$STAGE"

          echo "--- Converting sparse HFS+ to UDBZ ---"
          hdiutil convert "$SPARSE" -format UDBZ -o "$DMG_NAME" -ov
          rm -f "$SPARSE"

          echo "--- Verify staple xattr survived UDBZ conversion ---"
          hdiutil attach "$DMG_NAME" -readonly -nobrowse
          XATTR_UDBZ=$(xattr -p com.apple.security.cms "/Volumes/WhoNow/WhoNow.app" 2>/dev/null | wc -c || echo "0")
          echo "com.apple.security.cms xattr size inside UDBZ: $XATTR_UDBZ bytes"
          xcrun stapler validate "/Volumes/WhoNow/WhoNow.app" 2>&1; echo "stapler validate UDBZ exit: $?"
          if [[ "$XATTR_UDBZ" -lt 10 ]]; then
            echo "::error::Staple xattr LOST during HFS+ sparse → UDBZ conversion. The HFS+ B-tree did not preserve the directory xattr."
            hdiutil detach /Volumes/WhoNow
            exit 1
          fi
          echo "--- spctl inside UDBZ DMG (no quarantine) ---"
          spctl -a -t execute -vvv "/Volumes/WhoNow/WhoNow.app" 2>&1 || true
          hdiutil detach /Volumes/WhoNow

          # ---- STEP 6: Sign and notarize the DMG ----
          echo "========== STEP 6: Sign and notarize DMG =========="
          codesign --force --sign "$IDENTITY" "$DMG_NAME"
          SUBMIT_DMG_OUT=$(xcrun notarytool submit "$DMG_NAME" \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --password "${{ secrets.APPLE_PASSWORD }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" \
            --wait 2>&1)
          echo "$SUBMIT_DMG_OUT"
          DMG_SUB_ID=$(echo "$SUBMIT_DMG_OUT" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)
          if [[ -n "$DMG_SUB_ID" ]]; then
            echo "--- DMG notarization log ---"
            xcrun notarytool log "$DMG_SUB_ID" \
              --apple-id "${{ secrets.APPLE_ID }}" \
              --password "${{ secrets.APPLE_PASSWORD }}" \
              --team-id "${{ secrets.APPLE_TEAM_ID }}" 2>&1 || true
          fi
          xcrun stapler staple "$DMG_NAME"

          # ---- STEP 7: Final verification ----
          echo "========== STEP 7: Final verification =========="
          hdiutil attach "$DMG_NAME" -readonly -nobrowse
          echo "--- CDHash ---"
          codesign -dvvvv "/Volumes/WhoNow/WhoNow.app" 2>&1 | grep -iE "CDHash" || true
          echo "--- staple xattr ---"
          XATTR_FINAL=$(xattr -p com.apple.security.cms "/Volumes/WhoNow/WhoNow.app" 2>/dev/null | wc -c || echo "0")
          echo "com.apple.security.cms xattr size in final DMG: $XATTR_FINAL bytes"
          echo "--- stapler validate ---"
          xcrun stapler validate "/Volumes/WhoNow/WhoNow.app" 2>&1; echo "stapler validate final: $?"
          echo "--- spctl (no quarantine) ---"
          spctl -a -t execute -vvv "/Volumes/WhoNow/WhoNow.app" 2>&1 || true
          echo "--- spctl with quarantine 0181 ---"
          rm -rf /tmp/whonow_q_test && mkdir -p /tmp/whonow_q_test
          cp -R "/Volumes/WhoNow/WhoNow.app" "/tmp/whonow_q_test/WhoNow.app"
          QUARANTINE_TS=$(printf '%x' "$(date +%s)")
          xattr -w com.apple.quarantine "0181;${QUARANTINE_TS};Chrome;00000000-0000-0000-0000-000000000000" "/tmp/whonow_q_test/WhoNow.app"
          spctl -a -t execute -vvv "/tmp/whonow_q_test/WhoNow.app" 2>&1 || true
          rm -rf /tmp/whonow_q_test
          hdiutil detach /Volumes/WhoNow

          # ---- STEP 8: Upload and round-trip verify ----
          echo "========== STEP 8: Upload and round-trip =========="
          shasum -a 256 "$DMG_NAME" > "$DMG_NAME.sha256"
          gh release upload "$GITHUB_REF_NAME" "$DMG_NAME" "$DMG_NAME.sha256" --clobber
          echo "--- Round-trip: download and verify staple xattr survived ---"
          gh release download "$GITHUB_REF_NAME" -p "$DMG_NAME" -D /tmp --clobber
          hdiutil attach "/tmp/$DMG_NAME" -readonly -nobrowse
          XATTR_RT=$(xattr -p com.apple.security.cms "/Volumes/WhoNow/WhoNow.app" 2>/dev/null | wc -c || echo "0")
          echo "com.apple.security.cms xattr size after round-trip: $XATTR_RT bytes"
          xcrun stapler validate "/Volumes/WhoNow/WhoNow.app" 2>&1; echo "stapler validate round-trip: $?"
          hdiutil detach /Volumes/WhoNow
          rm -f "/tmp/$DMG_NAME"
