# Build Windows + macOS installers on tag push using official tauri-action.
# Push a tag (e.g. v1.0.0) to trigger: git tag v1.0.0 && git push origin v1.0.0
#
# Version is set automatically from the tag (e.g. v1.0.0 → 1.0.0).
#
# Required repo secrets (Settings → Secrets → Actions):
#   VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY
#   TAURI_SIGNING_PRIVATE_KEY (contents of ~/.tauri/whonow.key - copy with pbcopy)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD (password you set - or omit this secret if no password)
#   APPLE_CERTIFICATE (base64 of .p12: base64 -i WhoNow.p12 | pbcopy)
#   APPLE_CERTIFICATE_PASSWORD, KEYCHAIN_PASSWORD
#   APPLE_ID, APPLE_PASSWORD (app-specific password), APPLE_TEAM_ID
#   Alternatively for notarization: APPLE_API_ISSUER, APPLE_API_KEY, APPLE_API_KEY_PATH (often more reliable in CI)
# Optional: VITE_APP_URL as repo Variable or Secret (e.g. https://app.whonow.co) so
# verification emails from the desktop app link to your web app, not tauri://localhost.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    # macOS notarization can take 20–60+ min when Apple's queue is slow; Windows is much faster
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'windows-latest'
            args: '--bundles msi'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set version from tag
        run: node scripts/set-version-from-tag.js

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies
        run: npm ci

      - name: Import Apple Developer Certificate
        id: apple-cert
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          CERT_LINE=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1)
          IDENTITY=$(echo "$CERT_LINE" | sed -n 's/.*"\(.*\)".*/\1/p')
          echo "signing_identity=$IDENTITY" >> $GITHUB_OUTPUT

      - name: Increase notary upload timeout
        if: matrix.platform == 'macos-latest'
        run: |
          defaults write com.apple.gke.notary.tool nt-upload-connection-timeout 600

      - name: Build and release with tauri-action
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_APP_LAUNCH_MODE: live
          VITE_APP_URL: ${{ vars.VITE_APP_URL || secrets.VITE_APP_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ steps.apple-cert.outputs.signing_identity }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'WhoNow ${{ github.ref_name }}'
          releaseBody: 'See the assets to download and install.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          includeUpdaterJson: true
          tauriScript: npm run tauri
