# Build Windows + macOS installers on tag push using official tauri-action.
# Push a tag (e.g. v1.0.0) to trigger: git tag v1.0.0 && git push origin v1.0.0
#
# Version is set automatically from the tag (e.g. v1.0.0 → 1.0.0).
#
# Required repo secrets (Settings → Secrets → Actions):
#   VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY
#   TAURI_SIGNING_PRIVATE_KEY (contents of ~/.tauri/whonow.key - copy with pbcopy)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD (password you set - or omit if no password)
#   RELEASE_GITHUB_TOKEN - PAT with repo scope (classic) or Contents + Metadata (fine-grained); used to create the release
#   macOS: APPLE_CERTIFICATE (base64 of .p12), APPLE_CERTIFICATE_PASSWORD, KEYCHAIN_PASSWORD
#   macOS notarization: APPLE_ID, APPLE_PASSWORD (app-specific), APPLE_TEAM_ID
# Optional: VITE_APP_URL as repo Variable or Secret (e.g. https://app.whonow.co)
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Create the release first with PAT so tauri-action can upload (avoids "Resource not accessible by integration").
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release for tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: WhoNow ${{ github.ref_name }}
          body: See the assets to download and install.
          draft: false
          token: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}

  release:
    needs: create-release
    permissions:
      contents: write
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'windows-latest'
            args: '--bundles msi'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set version from tag
        run: node scripts/set-version-from-tag.js

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies
        run: npm ci

      - name: Import Apple Developer Certificate
        id: apple-cert
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          CERT_LINE=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1)
          IDENTITY=$(echo "$CERT_LINE" | sed -n 's/.*"\(.*\)".*/\1/p')
          echo "signing_identity=$IDENTITY" >> $GITHUB_OUTPUT

      - name: Increase notary upload timeout
        if: matrix.platform == 'macos-latest'
        run: |
          defaults write com.apple.gke.notary.tool nt-upload-connection-timeout 600

      - name: Build and release with tauri-action
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_APP_LAUNCH_MODE: live
          VITE_APP_URL: ${{ vars.VITE_APP_URL || secrets.VITE_APP_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CI: ${{ matrix.platform == 'macos-latest' && 'true' || 'false' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ steps.apple-cert.outputs.signing_identity }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'WhoNow ${{ github.ref_name }}'
          releaseBody: 'See the assets to download and install.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          includeUpdaterJson: true
          tauriScript: npm run tauri

      # Re-package DMG from the stapled app: proper layout (app + Applications symlink) and re-upload
      - name: Rebuild DMG from stapled app and re-upload
        if: matrix.platform == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if [[ "${{ matrix.args }}" == *"aarch64"* ]]; then
            TARGET="aarch64-apple-darwin"
            ARCH="aarch64"
          else
            TARGET="x86_64-apple-darwin"
            ARCH="x64"
          fi
          APP="src-tauri/target/${TARGET}/release/bundle/macos/WhoNow.app"
          DMG_NAME="WhoNow_${VER}_${ARCH}.dmg"
          IDENTITY="${{ steps.apple-cert.outputs.signing_identity }}"
          CODE_RESOURCES="$APP/Contents/CodeResources"
          if [[ -L "$CODE_RESOURCES" ]]; then
            echo "CodeResources is a symlink; removing and re-signing (inside-out) so stapling can work..."
            rm "$CODE_RESOURCES"
            # Sign nested code first (Apple: avoid --deep; sign innermost then outer)
            for d in "$APP/Contents/Frameworks"/*.framework; do
              [[ -d "$d" ]] && codesign --force --options runtime --sign "$IDENTITY" "$d"
            done 2>/dev/null || true
            while IFS= read -r f; do
              [[ -n "$f" ]] && codesign --force --options runtime --sign "$IDENTITY" "$f"
            done < <(find "$APP" -type f \( -perm +111 -o -name "*.dylib" \) ! -path "*/_CodeSignature/*" 2>/dev/null | awk -F/ '{print NF, $0}' | sort -rn | cut -d' ' -f2-)
            codesign --force --options runtime --sign "$IDENTITY" "$APP"
            echo "Re-notarizing and re-stapling app after re-sign..."
            ditto -c -k --keepParent "$APP" WhoNow.zip
            xcrun notarytool submit WhoNow.zip --apple-id "${{ secrets.APPLE_ID }}" --password "${{ secrets.APPLE_PASSWORD }}" --team-id "${{ secrets.APPLE_TEAM_ID }}" --wait
            xcrun stapler staple "$APP"
            rm -f WhoNow.zip
          fi
          # Tauri staples the DMG it produces, not the inner app bundle.
          # Staple the app bundle directly so the ticket is locally embedded before DMG creation.
          # For .app bundles the ticket is stored inside the bundle (not as a directory xattr),
          # so we verify success via the stapler's own output message, not via xattr -l.
          echo "Stapling notarization ticket to app bundle..."
          STAPLE_OUT=$(xcrun stapler staple "$APP" 2>&1)
          echo "$STAPLE_OUT"
          echo "$STAPLE_OUT" | grep -q "The staple and validate action worked!" || { echo "::error::xcrun stapler staple did not confirm local embedding — output: $STAPLE_OUT"; exit 1; }
          echo "Checking for entitlements that can cause Gatekeeper to reject..."
          if codesign -d --entitlements - --xml -- "$APP" 2>/dev/null | grep -qE 'allow-jit|allow-unsigned-executable-memory'; then
            echo "::error::App or a nested binary has allow-jit or allow-unsigned-executable-memory; Gatekeeper may reject. Adjust Tauri entitlements."
            exit 1
          fi
          echo "Verifying app is notarized/stapled..."
          xcrun stapler validate "$APP" || { echo "::error::App is not stapled; release DMG would be unnotarized."; exit 1; }
          echo "Verifying app would be accepted by Gatekeeper (spctl)..."
          spctl -a -t execute -v -- "$APP" || { echo "::error::App would be rejected by Gatekeeper (spctl). Check entitlements and bundle."; exit 1; }
          STAGE="dmg-stage"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          ditto "$APP" "$STAGE/WhoNow.app"
          # Explicitly set execute permission on all binaries so the bit survives
          # any filesystem or copy operation that may strip it.
          find "$STAGE/WhoNow.app" -type f \( -path "*/MacOS/*" -o -name "*.dylib" -o -name "*.so" \) -exec chmod +x {} \;
          echo "Verifying stapled ticket survived ditto copy..."
          xcrun stapler validate "$STAGE/WhoNow.app" || { echo "::error::Stapled ticket lost during ditto copy."; exit 1; }
          spctl -a -t execute -v -- "$STAGE/WhoNow.app" || { echo "::error::Gatekeeper would reject staged app (entitlements/bundle?)."; exit 1; }
          echo "Strict codesign verification on staged app..."
          codesign -d -vvv --strict "$STAGE/WhoNow.app" || { echo "::error::Stapled app failed strict codesign check (bundle structure?)."; exit 1; }
          echo "CDHash of staged app:"
          codesign -d --verbose=2 "$STAGE/WhoNow.app" 2>&1 | grep -E "CDHash|Identifier|TeamIdentifier"
          ln -s /Applications "$STAGE/Applications"
          INSTALL_SCRIPT="$STAGE/Install WhoNow.command"
          printf '%s\n' \
            '#!/bin/bash' \
            'set -e' \
            'VOL="/Volumes/WhoNow"' \
            'APP="$VOL/WhoNow.app"' \
            'if [[ ! -d "$APP" ]]; then' \
            '  echo "WhoNow.app not found. Make sure the WhoNow disk image is mounted."' \
            '  read -n 1 -p "Press a key to close..."' \
            '  exit 1' \
            'fi' \
            'echo "Installing WhoNow to Applications..."' \
            'ditto "$APP" "/Applications/WhoNow.app"' \
            'xattr -d com.apple.quarantine "/Applications/WhoNow.app" 2>/dev/null || true' \
            'echo "Done. Opening WhoNow."' \
            'open -a WhoNow 2>/dev/null || true' \
            'exit 0' \
            > "$INSTALL_SCRIPT"
          chmod +x "$INSTALL_SCRIPT"
          # Use APFS for the internal DMG volume. On HFS+ the staple ticket is stored as a
          # directory xattr, which Finder silently drops when dragging from HFS+ to APFS
          # (/Applications). APFS-to-APFS Finder copies preserve directory xattrs, so the
          # ticket survives the standard drag-and-drop install flow.
          echo "Creating DMG via mounted APFS volume to preserve staple ticket across Finder copies..."
          TEMP_APFS="temp_apfs.dmg"
          rm -f "$DMG_NAME" "$TEMP_APFS"
          hdiutil create -size 250m -fs APFS -volname "WhoNow" -o "$TEMP_APFS" -ov
          hdiutil attach "$TEMP_APFS" -nobrowse
          ditto "$STAGE/WhoNow.app" "/Volumes/WhoNow/WhoNow.app"
          # Re-apply execute permission after ditto into the APFS volume.
          find "/Volumes/WhoNow/WhoNow.app" -type f \( -path "*/MacOS/*" -o -name "*.dylib" -o -name "*.so" \) -exec chmod +x {} \;
          cp -p "$STAGE/Install WhoNow.command" "/Volumes/WhoNow/Install WhoNow.command"
          # Sign install script so Gatekeeper allows it when user double-clicks
          codesign --force --sign "$IDENTITY" "/Volumes/WhoNow/Install WhoNow.command"
          ln -s /Applications "/Volumes/WhoNow/Applications"
          # Staple the app inside the mounted APFS volume. On APFS the ticket is stored as an
          # APFS xattr that survives APFS-to-APFS Finder copies.
          STAPLE_VOL_OUT=$(xcrun stapler staple "/Volumes/WhoNow/WhoNow.app" 2>&1)
          echo "$STAPLE_VOL_OUT"
          echo "$STAPLE_VOL_OUT" | grep -q "The staple and validate action worked!" || { hdiutil detach /Volumes/WhoNow; echo "::error::xcrun stapler staple did not confirm local embedding inside APFS volume — output: $STAPLE_VOL_OUT"; exit 1; }
          hdiutil detach /Volumes/WhoNow
          # Use UDBZ (bzip2 compressed, industry-standard macOS DMG format).
          hdiutil convert "$TEMP_APFS" -format UDBZ -o "$DMG_NAME" -ov
          rm -f "$TEMP_APFS"
          rm -rf "$STAGE"
          echo "Verifying app inside DMG still has stapled ticket and passes Gatekeeper..."
          hdiutil attach "$DMG_NAME" -readonly -nobrowse
          APP_IN_DMG="/Volumes/WhoNow/WhoNow.app"
          xcrun stapler validate "$APP_IN_DMG" || { hdiutil detach /Volumes/WhoNow; echo "::error::Stapled ticket lost inside UDBZ DMG after hdiutil convert."; exit 1; }
          spctl -a -t execute -v -- "$APP_IN_DMG" || { hdiutil detach /Volumes/WhoNow; echo "::error::Gatekeeper would reject app inside DMG."; exit 1; }
          hdiutil detach /Volumes/WhoNow
          codesign --force --sign "${{ steps.apple-cert.outputs.signing_identity }}" "$DMG_NAME"
          echo "Notarizing DMG so opening the disk image is trusted..."
          xcrun notarytool submit "$DMG_NAME" --apple-id "${{ secrets.APPLE_ID }}" --password "${{ secrets.APPLE_PASSWORD }}" --team-id "${{ secrets.APPLE_TEAM_ID }}" --wait
          # DMG staple ticket is embedded in the DMG binary itself (not as an xattr),
          # so verify via stapler output message, not via xattr -l.
          STAPLE_DMG_OUT=$(xcrun stapler staple "$DMG_NAME" 2>&1)
          echo "$STAPLE_DMG_OUT"
          echo "$STAPLE_DMG_OUT" | grep -q "The staple and validate action worked!" || { echo "::error::xcrun stapler staple did not confirm local embedding on DMG — output: $STAPLE_DMG_OUT"; exit 1; }
          echo "Simulated user install: cp -R from DMG, apply quarantine, verify staple and spctl..."
          hdiutil attach "$DMG_NAME" -readonly -nobrowse
          rm -rf /tmp/whonow_install_test
          mkdir -p /tmp/whonow_install_test
          cp -R "/Volumes/WhoNow/WhoNow.app" "/tmp/whonow_install_test/WhoNow.app"
          # Re-apply execute permission in case cp -R dropped it.
          find "/tmp/whonow_install_test/WhoNow.app" -type f \( -path "*/MacOS/*" -o -name "*.dylib" -o -name "*.so" \) -exec chmod +x {} \;
          # Verify the staple ticket survived the copy (without quarantine).
          xcrun stapler validate "/tmp/whonow_install_test/WhoNow.app" || { hdiutil detach /Volumes/WhoNow 2>/dev/null; echo "::error::Staple ticket lost after cp -R. Finder drag-and-drop will fail; users must use Install WhoNow.command."; exit 1; }
          # Apply a quarantine attribute to simulate a browser-downloaded copy, then verify
          # Gatekeeper accepts it. This is what actually happens on a user's machine and
          # catches online-notarization-check failures that cp -R without quarantine misses.
          QUARANTINE_TS=$(printf '%x' "$(date +%s)")
          xattr -w com.apple.quarantine "0001;${QUARANTINE_TS};Safari;00000000-0000-0000-0000-000000000000" "/tmp/whonow_install_test/WhoNow.app"
          echo "spctl check with quarantine attribute (simulates Gatekeeper on user machine)..."
          spctl -a -t execute -vvv "/tmp/whonow_install_test/WhoNow.app" || { hdiutil detach /Volumes/WhoNow 2>/dev/null; echo "::error::Gatekeeper would reject quarantined app — online notarization check is failing. The app CDHash is not resolving on Apple's servers."; exit 1; }
          rm -rf /tmp/whonow_install_test
          hdiutil detach /Volumes/WhoNow
          shasum -a 256 "$DMG_NAME" > "$DMG_NAME.sha256"
          gh release upload "$GITHUB_REF_NAME" "$DMG_NAME" "$DMG_NAME.sha256" --clobber
          echo "Post-upload verification: download asset and confirm app inside has staple..."
          gh release download "$GITHUB_REF_NAME" -p "$DMG_NAME" --clobber
          hdiutil attach "$DMG_NAME" -readonly -nobrowse
          xcrun stapler validate "/Volumes/WhoNow/WhoNow.app" || { hdiutil detach /Volumes/WhoNow 2>/dev/null; echo "::error::App inside downloaded DMG has no staple (round-trip lost notarization)."; exit 1; }
          spctl -a -t execute -v -- "/Volumes/WhoNow/WhoNow.app" || { hdiutil detach /Volumes/WhoNow 2>/dev/null; echo "::error::Gatekeeper would reject app inside downloaded DMG."; exit 1; }
          hdiutil detach /Volumes/WhoNow
          rm -f "$DMG_NAME"
