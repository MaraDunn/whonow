[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_APP_LAUNCH_MODE = "live"
  # Note: VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY should be set in Netlify UI
  # (Site settings → Environment variables) for security, but can be added here if needed
  # Landing page download buttons (replace tag/filenames with your actual GitHub release):
  VITE_DOWNLOAD_URL_WINDOWS = "https://github.com/MaraDunn/whonow/releases/download/v1.0.0/WhoNow_0.0.0_x64_en-US.msi"
  VITE_DOWNLOAD_URL_MAC     = "https://github.com/MaraDunn/whonow/releases/download/v1.0.0/WhoNow_0.0.0_aarch64.dmg"

# Block common exploit paths and bot scanners (return 404 before catch-all)
# These are clearly exploit attempts and should be blocked explicitly
[[redirects]]
  from = "/wp-*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*.php"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/xmlrpc.php*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/index.php*"
  to = "/404.html"
  status = 404

# Catch-all redirect for SPA routing (must be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
