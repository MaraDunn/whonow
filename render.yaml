services:
  - type: web
    name: paddleocr-service
    rootDir: ocr-service
    env: docker
    plan: free  # Start with free tier (750 hours/month)
    # Upgrade to 'starter' ($7/month) for always-on service
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHONUNBUFFERED
        value: 1

